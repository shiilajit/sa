<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOOGEEER Premium COD V1</title>

    main { width: min(100%, 760px); text-align: center; padding: clamp(32px, 8vw, 76px) 24px; border: 1px solid #b99754; border-radius: 18px; background: rgba(10,10,10,.58); box-shadow: 0 18px 60px rgba(0,0,0,.38); }
    .eyebrow { margin: 0 0 18px; color: #c9a96a; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 58px); line-height: 1.15; font-weight: 700; letter-spacing: .015em; }
    .rule { width: 76px; height: 2px; margin: 28px auto 0; background: linear-gradient(90deg, transparent, #d7b66f, transparent); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GOOGEEER</p>
    <h1>GOOGEEER Premium COD V1</h1>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
